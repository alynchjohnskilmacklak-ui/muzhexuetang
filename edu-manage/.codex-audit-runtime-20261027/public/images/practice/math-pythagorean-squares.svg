<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc">
  <title id="title">勾股定理与三边上的正方形</title>
  <desc id="desc">直角三角形两条直角边上作正方形A和C，斜边上作正方形B；B面积为25，C面积为9。</desc>
  <rect width="720" height="700" rx="18" fill="#fff"/>
  <g stroke="#284c47" stroke-width="3.5" stroke-linejoin="round">
    <path d="M220 430 220 230 420 430Z" fill="#f8f1de"/>
    <path d="M220 430 220 230 20 230 20 430Z" fill="#eaf4f1"/>
    <path d="M220 430 420 430 420 630 220 630Z" fill="#f5f2ee"/>
    <path d="M220 230 420 430 620 230 420 30Z" fill="#fff3ec"/>
  </g>
  <path d="M220 430h28v-28h-28" fill="none" stroke="#8a6517" stroke-width="3"/>
  <g fill="#1a1201" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" text-anchor="middle" font-weight="600">
    <text x="120" y="335" font-size="25">正方形 A</text><text x="120" y="372" font-size="22">面积？</text>
    <text x="320" y="542" font-size="25">正方形 C</text><text x="320" y="580" font-size="22">面积 9</text>
    <text x="420" y="190" font-size="25">正方形 B</text><text x="420" y="225" font-size="22">面积 25</text>
    <text x="198" y="456" font-size="20">直角</text>
  </g>
</svg>
