<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290" role="img" aria-labelledby="title desc">
  <title id="title">南北向与东西向铁路在枢纽换乘示意</title>
  <desc id="desc">甲线连接北站P、枢纽X、南站Q；乙线连接西站R、枢纽X、东站S。旅客从R换乘后向南前往Q。</desc>
  <rect width="700" height="290" rx="18" fill="#fff"/>
  <path d="M350 63V226M142 145H558" stroke="#555e68" stroke-width="12" stroke-linecap="round"/>
  <path d="M350 63V226M142 145H558" stroke="#fff" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="350" cy="145" r="19" fill="#e8784a" stroke="#9b4527" stroke-width="3"/>
  <g font-family="sans-serif" font-size="22" font-weight="700" fill="#30343b" text-anchor="middle">
    <text x="350" y="48">北站 P</text><text x="350" y="263">南站 Q</text><text x="115" y="153">西站 R</text><text x="585" y="153">东站 S</text>
  </g>
  <text x="350" y="151" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">X</text>
  <text x="378" y="86" font-family="sans-serif" font-size="17" fill="#555">甲线</text><text x="495" y="132" font-family="sans-serif" font-size="17" fill="#555">乙线</text>
  <path d="M119 199V165H321" fill="none" stroke="#4376a8" stroke-width="4" stroke-dasharray="8 6"/><path d="M310 156L327 165L310 174" fill="none" stroke="#4376a8" stroke-width="4"/>
  <path d="M350 174V222" stroke="#e8784a" stroke-width="4" stroke-dasharray="7 5"/><path d="M341 211L350 228L359 211" fill="none" stroke="#e8784a" stroke-width="4"/>
  <text x="440" y="244" font-family="sans-serif" font-size="16" fill="#8d4429">换乘后向南</text>
  <text x="350" y="283" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#777">示意图（北向上）</text>
</svg>
