  </g>
  <g stroke="#e8784a" stroke-width="4" stroke-linecap="round">
    <path d="M168 135l12 15M168 255l12-15"/>
    <path d="M379 116l-5 17M394 122l-5 17M379 273l-5-17M394 267l-5-17"/>
