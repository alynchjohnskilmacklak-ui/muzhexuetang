<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">5欧和15欧电阻串联接在8伏电源上</title>
  <desc id="desc">电源、5欧电阻R1和15欧电阻R2组成串联闭合电路。</desc>
  <rect width="760" height="300" fill="#fff"/>
  <style>
    .wire{fill:none;stroke:#222;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .part{fill:#fff;stroke:#222;stroke-width:3}
    .label{font:22px sans-serif;fill:#171717}
    .small{font:18px sans-serif;fill:#555}
  </style>
  <path class="wire" d="M130 80 H270 M400 80 H530 M650 80 V235 H130 V80"/>
  <rect class="part" x="270" y="58" width="130" height="44" rx="4"/>
  <rect class="part" x="530" y="58" width="120" height="44" rx="4"/>
  <text x="335" y="48" text-anchor="middle" class="label">R₁</text>
  <text x="590" y="48" text-anchor="middle" class="label">R₂</text>
  <text x="335" y="87" text-anchor="middle" class="small">5 Ω</text>
  <text x="590" y="87" text-anchor="middle" class="small">15 Ω</text>
  <path class="wire" d="M130 135 V153 M130 193 V235 M108 153 H152 M116 193 H144"/>
  <text x="164" y="180" class="label">8 V</text>
</svg>
