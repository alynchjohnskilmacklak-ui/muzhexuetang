<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">四种候选函数图象</title>
  <desc id="desc">甲为竖直直线，乙为开口向上的抛物线，丙为圆，丁为开口向右的抛物线。</desc>
  <rect width="900" height="500" fill="#fff"/>
  <style>
    .panel{fill:#fff;stroke:#dedbd7;stroke-width:2}
    .axis{fill:none;stroke:#333;stroke-width:2.5;stroke-linecap:round}
    .graph{fill:none;stroke:#e8784a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .label{font:24px sans-serif;font-weight:700;fill:#171717}
    .small{font:17px sans-serif;fill:#555}
  </style>
  <g transform="translate(20 20)">
    <rect class="panel" width="415" height="220" rx="12"/>
    <text x="24" y="34" class="label">甲</text>
    <path class="axis" d="M100 170 H330 M215 195 V62"/>
    <path class="graph" d="M260 68 V190"/>
    <text x="335" y="176" class="small">x</text><text x="220" y="58" class="small">y</text>
  </g>
  <g transform="translate(465 20)">
    <rect class="panel" width="415" height="220" rx="12"/>
    <text x="24" y="34" class="label">乙</text>
    <path class="axis" d="M100 150 H330 M215 195 V62"/>
    <path class="graph" d="M145 75 Q215 205 285 75"/>
    <text x="335" y="156" class="small">x</text><text x="220" y="58" class="small">y</text>
  </g>
  <g transform="translate(20 260)">
    <rect class="panel" width="415" height="220" rx="12"/>
    <text x="24" y="34" class="label">丙</text>
    <path class="axis" d="M100 150 H330 M215 195 V62"/>
    <circle class="graph" cx="215" cy="150" r="52"/>
    <text x="335" y="156" class="small">x</text><text x="220" y="58" class="small">y</text>
  </g>
  <g transform="translate(465 260)">
    <rect class="panel" width="415" height="220" rx="12"/>
    <text x="24" y="34" class="label">丁</text>
    <path class="axis" d="M100 150 H330 M215 195 V62"/>
    <path class="graph" d="M115 195 Q295 150 115 105"/>
    <text x="335" y="156" class="small">x</text><text x="220" y="58" class="small">y</text>
  </g>
</svg>
