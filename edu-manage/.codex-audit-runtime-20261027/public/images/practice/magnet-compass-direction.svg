<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
  <title id="title">条形磁体附近小磁针与磁场方向</title>
  <desc id="desc">条形磁体左端为N极、右端为S极，小磁针位于磁体上方，其N极指向右方。</desc>
  <rect width="760" height="280" rx="18" fill="#fff"/>
  <rect x="214" y="168" width="150" height="64" rx="9" fill="#e9784a" stroke="#9b4527" stroke-width="3"/>
  <rect x="364" y="168" width="150" height="64" rx="9" fill="#7d8b9d" stroke="#4c5968" stroke-width="3"/>
  <text x="289" y="210" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#fff">N</text>
  <text x="439" y="210" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#fff">S</text>
  <text x="364" y="257" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555">条形磁体</text>
  <circle cx="364" cy="93" r="53" fill="#fff" stroke="#7a7a7a" stroke-width="3"/>
  <path d="M321 93H407" stroke="#30343b" stroke-width="4"/>
  <path d="M407 93L388 81L394 93L388 105Z" fill="#e8784a" stroke="#9b4527" stroke-width="2"/>
  <path d="M321 93L340 81L334 93L340 105Z" fill="#748396" stroke="#4c5968" stroke-width="2"/>
  <text x="414" y="83" font-family="sans-serif" font-size="20" fill="#8d4429">N</text><text x="296" y="83" font-family="sans-serif" font-size="20" fill="#4c5968">S</text>
  <path d="M256 128H472" stroke="#4376a8" stroke-width="3" stroke-dasharray="8 7"/>
  <path d="M460 119L476 128L460 137" fill="none" stroke="#4376a8" stroke-width="3" stroke-linejoin="round"/>
  <text x="364" y="29" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#555">小磁针静止时N极指向右方</text>
</svg>
