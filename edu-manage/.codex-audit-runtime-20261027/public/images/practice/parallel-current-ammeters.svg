  <circle cx="342" cy="188" r="27" fill="#fff" stroke="#30343b" stroke-width="4"/><text x="342" y="196" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">L₁</text>
  <circle cx="505" cy="156" r="27" fill="#fff" stroke="#30343b" stroke-width="4"/><text x="505" y="164" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">L₂</text>
