<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">A、B 两种物质的溶解度曲线</title>
  <desc id="desc">A 曲线随温度明显上升，B 曲线缓慢上升，两条曲线在 40 摄氏度、每百克水 40 克处相交。</desc>
  <rect width="760" height="430" rx="24" fill="#fff"/>
  <g stroke="#e7ebf0" stroke-width="1">
    <path d="M120 80V340M220 80V340M320 80V340M420 80V340M520 80V340M620 80V340"/>
    <path d="M120 340H640M120 300H640M120 260H640M120 220H640M120 180H640M120 140H640M120 100H640"/>
  </g>
  <g stroke="#364454" stroke-width="3" fill="none">
    <path d="M120 340H654M120 355V72"/>
    <path d="m654 340-12-7v14z" fill="#364454" stroke="none"/>
    <path d="m120 72-7 12h14z" fill="#364454" stroke="none"/>
  </g>
  <path d="M220 260 320 180 420 100 520 80" fill="none" stroke="#e8784a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M220 200 320 180 420 160 520 140" fill="none" stroke="#3478b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#e8784a" stroke="#fff" stroke-width="3"><circle cx="220" cy="260" r="7"/><circle cx="320" cy="180" r="7"/><circle cx="420" cy="100" r="7"/></g>
  <g fill="#3478b8" stroke="#fff" stroke-width="3"><circle cx="220" cy="200" r="7"/><circle cx="320" cy="180" r="7"/><circle cx="420" cy="160" r="7"/></g>
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" fill="#586273">
    <text x="204" y="370">20</text><text x="304" y="370">40</text><text x="404" y="370">60</text><text x="504" y="370">80</text>
    <text x="84" y="306">10</text><text x="84" y="266">20</text><text x="84" y="226">30</text><text x="84" y="186">40</text><text x="84" y="146">50</text><text x="84" y="106">60</text>
    <text x="585" y="368">温度/℃</text><text x="136" y="72">溶解度/(g/100 g 水)</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <text x="536" y="77" fill="#c86438">A</text><text x="536" y="151" fill="#2d689e">B</text>
  </g>
  <circle cx="320" cy="180" r="11" fill="none" stroke="#263446" stroke-width="2"/>
  <text x="340" y="205" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="16" fill="#536272">交点：40 ℃，40 g</text>
</svg>
