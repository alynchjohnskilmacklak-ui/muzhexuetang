name: edu-manage

services:
  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 192m
    networks:
      - internal

  db:
    image: public.ecr.aws/docker/library/postgres:15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: edu_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    shm_size: 128m
    networks:
      - internal

  app:
    image: edu-manage-app:latest
    build:
      context: .
      target: runner
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://edu_admin:${POSTGRES_PASSWORD}@db:5432/muzhe_chuzhong?schema=public
      DATABASE_URL_JUNIOR: postgresql://edu_admin:${POSTGRES_PASSWORD}@db:5432/muzhe_chuzhong?schema=public
      DATABASE_URL_SENIOR: postgresql://edu_admin:${POSTGRES_PASSWORD}@db:5432/muzhe_gaozhong?schema=public
      DUAL_DB: "true"
      APP_TIMEZONE: Asia/Shanghai
      TZ: Asia/Shanghai
      APP_ROOT: /app
      RATE_LIMIT_DRIVER: redis
      BACKUP_DIR: /data/backups/edu-manage
      BACKUP_SCRIPT: /app/scripts/backup-now.sh
      UPLOAD_DIR: /app/public/uploads
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - /srv/edu-manage/shared/public/home.html:/app/public/home.html
      - /srv/edu-manage/shared/public/uploads:/app/public/uploads
      - /srv/edu-manage/shared/public/services:/app/public/services
      - /srv/edu-manage/shared/public/marketing:/app/public/marketing
      - /srv/edu-manage/shared/public/business-assets:/app/public/business-assets
      - /srv/edu-manage/shared/public/volunteer/docs:/app/public/volunteer/docs
      - /data/backups/edu-manage:/data/backups/edu-manage
      - next_cache:/app/.next/cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 900m
    networks:
      - internal

  migrate:
    image: edu-manage-migrator:latest
    build:
      context: .
      target: migrator
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://edu_admin:${POSTGRES_PASSWORD}@db:5432/muzhe_chuzhong?schema=public
      DATABASE_URL_JUNIOR: postgresql://edu_admin:${POSTGRES_PASSWORD}@db:5432/muzhe_chuzhong?schema=public
      DATABASE_URL_SENIOR: postgresql://edu_admin:${POSTGRES_PASSWORD}@db:5432/muzhe_gaozhong?schema=public
      DUAL_DB: "true"
      SKIP_PRISMA_GENERATE: "1"
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  next_cache:

networks:
  internal:
    driver: bridge
