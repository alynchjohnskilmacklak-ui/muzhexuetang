<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">抛物线拱门坐标图</title>
  <desc id="desc">顶点 P 位于 y 轴上方，拱门与 x 轴交于 A、B；图中标出水平净高线。</desc>
  <rect width="760" height="430" rx="24" fill="#fff"/>
  <g stroke="#e8edf2" stroke-width="1">
    <path d="M140 70V350M200 70V350M260 70V350M320 70V350M380 70V350M440 70V350M500 70V350M560 70V350M620 70V350"/>
    <path d="M120 90H650M120 140H650M120 190H650M120 240H650M120 290H650M120 340H650"/>
  </g>
  <g stroke="#384454" stroke-width="3" fill="none">
    <path d="M118 340H660"/><path d="M380 360V56"/>
    <path d="m660 340-12-7v14z" fill="#384454" stroke="none"/>
    <path d="m380 56-7 12h14z" fill="#384454" stroke="none"/>
  </g>
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" fill="#586273">
    <text x="668" y="346">x（m）</text><text x="390" y="52">y（m）</text>
    <text x="160" y="370">-4</text><text x="374" y="370">0</text><text x="584" y="370">4</text>
    <text x="350" y="284">2</text><text x="350" y="221">4</text><text x="350" y="159">6</text><text x="350" y="96">8</text>
  </g>
  <path d="M327.5 105.6H432.5" stroke="#b67b19" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="535" y="101" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="16" fill="#9a6510">净高线 y=7.5</text>
  <path d="M170 340 Q380 -160 590 340" fill="none" stroke="#e8784a" stroke-width="5" stroke-linecap="round"/>
  <g fill="#173f38" stroke="#fff" stroke-width="3">
    <circle cx="380" cy="90" r="7"/><circle cx="170" cy="340" r="7"/><circle cx="590" cy="340" r="7"/>
    <circle cx="485" cy="152.5" r="7"/>
  </g>
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#173f38">
    <text x="392" y="83">P(0，8)</text><text x="125" y="326">A(-4，0)</text><text x="596" y="326">B(4，0)</text><text x="495" y="184">x=2</text>
  </g>
  <path d="M485 152.5V340M380 90V340" stroke="#7b8794" stroke-dasharray="5 6" stroke-width="1.5"/>
