<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">三角形内角平分线示意图</title>
  <desc id="desc">三角形ABC中，BO和CO分别平分B角和C角，A角为70度，求BOC。</desc>
  <rect width="720" height="420" rx="18" fill="#fff"/>
  <g fill="none" stroke="#284c47" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M105 350 285 55 470 350Z"/>
    <path d="M105 350 294 264 470 350" stroke="#c46a40" stroke-width="3"/>
  </g>
  <g fill="#14574d">
    <circle cx="105" cy="350" r="5"/><circle cx="285" cy="55" r="5"/><circle cx="470" cy="350" r="5"/><circle cx="294" cy="264" r="6"/>
  </g>
  <g fill="none" stroke="#8a6517" stroke-width="2.5">
    <path d="M270 82 Q285 88 300 82"/>
    <path d="M129 331 Q137 337 140 347"/>
    <path d="M437 347 Q440 337 449 331"/>
    <path d="M282 278 Q294 286 307 278"/>
  </g>
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" font-weight="600" fill="#1a1201">
    <text x="264" y="38">A</text><text x="74" y="378">B</text><text x="478" y="378">C</text><text x="302" y="259">O</text>
    <text x="307" y="106" font-size="20" fill="#8a6517">70°</text>
    <text x="515" y="219" font-size="22">求 ∠BOC</text>
  </g>
</svg>
