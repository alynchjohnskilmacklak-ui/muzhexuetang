<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">圆外一点的两条切线</title>
  <desc id="desc">圆心 O 与圆外点 A 相连，切线 AP、AQ 分别切圆于 P、Q，半径 OP、OQ 画出。</desc>
  <rect width="760" height="430" rx="24" fill="#fff"/>
  <circle cx="310" cy="215" r="88" fill="#f5faf8" stroke="#217866" stroke-width="4"/>
  <path d="M650 215 333 130M650 215 333 300M310 215 333 130M310 215 333 300M310 215 650 215" fill="none" stroke-width="3" stroke-linecap="round"/>
  <path d="M650 215 333 130M650 215 333 300" stroke="#e8784a"/>
  <path d="M310 215 333 130M310 215 333 300" stroke="#356fbd"/>
  <path d="M310 215 650 215" stroke="#8792a0" stroke-dasharray="7 7"/>
  <g fill="#173f38" stroke="#fff" stroke-width="3">
    <circle cx="310" cy="215" r="7"/><circle cx="650" cy="215" r="7"/><circle cx="333" cy="130" r="7"/><circle cx="333" cy="300" r="7"/>
  </g>
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="700" fill="#263446">
    <text x="294" y="244">O</text><text x="660" y="222">A</text><text x="315" y="119">P</text><text x="315" y="326">Q</text>
    <text x="475" y="150" fill="#b85632">AP</text><text x="475" y="291" fill="#b85632">AQ</text>
    <text x="270" y="165" fill="#356fbd">OP</text><text x="270" y="280" fill="#356fbd">OQ</text>
  </g>
  <path d="M323 168l12 4-4 12M323 262l12-4-4-12" fill="none" stroke="#536272" stroke-width="2"/>
</svg>
