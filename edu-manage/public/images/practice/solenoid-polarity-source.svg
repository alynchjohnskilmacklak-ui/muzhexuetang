<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
  <title id="title">通电螺线管绕线与电源接线示意</title>
  <desc id="desc">左端观察线圈截面，绕线呈环形；电源端a连接线圈右侧引线，端b连接左侧引线。已知左端为N极，依据安培定则判断a端极性。</desc>
  <rect width="760" height="350" rx="18" fill="#fff"/>
  <text x="380" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">左端视图与接线示意（原创，未按比例）</text>
  <circle cx="335" cy="150" r="76" fill="#f4f1ec" stroke="#30343b" stroke-width="5"/>
  <circle cx="335" cy="150" r="50" fill="#fff" stroke="#e8784a" stroke-width="5"/>
  <path d="M381 112Q335 84 289 112" fill="none" stroke="#4376a8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="335" y="158" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#555">铁芯</text>
  <text x="335" y="72" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#8d4429">N（已知）</text>
  <text x="335" y="250" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#555">绕线端视图</text>
  <path d="M411 150H503V108H593V131M259 150H194V213H593V191" fill="none" stroke="#30343b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="503" cy="108" r="7" fill="#e8784a"/><circle cx="194" cy="213" r="7" fill="#748396"/>
  <text x="526" y="99" font-family="sans-serif" font-size="21" fill="#333">a</text><text x="169" y="239" font-family="sans-serif" font-size="21" fill="#333">b</text>
  <rect x="575" y="131" width="38" height="60" rx="5" fill="#f4f1ec" stroke="#30343b" stroke-width="3"/>
  <text x="594" y="157" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">直流</text>
  <text x="594" y="177" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">电源</text>
  <text x="633" y="143" font-family="sans-serif" font-size="18" fill="#555">电源</text>
  <text x="380" y="317" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#315d84">蓝色箭头表示从a流向b时经过的绕线方向。</text>
  <text x="380" y="339" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#777">按安培定则由左端N极判断线圈电流方向，再判断电源极性。</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4376a8"/></marker></defs>
</svg>
