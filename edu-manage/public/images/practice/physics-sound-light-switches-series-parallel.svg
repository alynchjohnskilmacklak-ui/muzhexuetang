<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
  <title id="title">声控灯中声控与光控开关的两种连接图</title>
  <desc id="desc">甲图中声控开关和光控开关串联；乙图中两个开关并联后与灯泡串联。开关均画为断开状态。</desc>
  <rect width="960" height="370" fill="#fff"/>
  <style>
    .wire{fill:none;stroke:#1a1a1a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .symbol{fill:#fff;stroke:#1a1a1a;stroke-width:4}
    .label{font:21px sans-serif;fill:#171717}
    .caption{font:25px sans-serif;font-weight:700;fill:#171717}
  </style>
  <text x="240" y="38" text-anchor="middle" class="caption">甲</text>
  <text x="720" y="38" text-anchor="middle" class="caption">乙</text>

  <!-- 甲：两开关串联，必须依次通过两个开关 -->
  <path class="wire" d="M70 130 H128 M170 130 H220 M262 130 H310 M350 130 H400 V300 H70 V130"/>
  <circle class="symbol" cx="128" cy="130" r="5"/><circle class="symbol" cx="170" cy="130" r="5"/>
  <path class="wire" d="M130 130 L158 114"/>
  <circle class="symbol" cx="220" cy="130" r="5"/><circle class="symbol" cx="262" cy="130" r="5"/>
  <path class="wire" d="M222 130 L250 114"/>
  <circle class="symbol" cx="330" cy="130" r="20"/><path class="wire" d="M316 116 L344 144 M344 116 L316 144"/>
  <text x="149" y="96" text-anchor="middle" class="label">S声</text>
  <text x="241" y="96" text-anchor="middle" class="label">S光</text>
  <text x="330" y="178" text-anchor="middle" class="label">L</text>
  <path class="wire" d="M70 190 V198 M70 222 V300 M53 198 H87 M60 222 H80"/>
  <text x="94" y="282" class="label">电源</text>

  <!-- 乙：两开关并联；任一支路闭合都会形成通路 -->
  <path class="wire" d="M550 130 H610 M610 130 V100 H665 M707 100 H790 V130 M610 130 V180 H665 M707 180 H790 V130 M790 130 H815 M855 130 H870 V300 H550 V130"/>
  <circle class="symbol" cx="665" cy="100" r="5"/><circle class="symbol" cx="707" cy="100" r="5"/>
  <path class="wire" d="M667 100 L695 84"/>
  <circle class="symbol" cx="665" cy="180" r="5"/><circle class="symbol" cx="707" cy="180" r="5"/>
  <path class="wire" d="M667 180 L695 164"/>
  <circle class="symbol" cx="835" cy="130" r="20"/><path class="wire" d="M821 116 L849 144 M849 116 L821 144"/>
  <text x="686" y="70" text-anchor="middle" class="label">S声</text>
  <text x="686" y="218" text-anchor="middle" class="label">S光</text>
  <text x="835" y="178" text-anchor="middle" class="label">L</text>
  <path class="wire" d="M550 190 V198 M550 222 V300 M533 198 H567 M540 222 H560"/>
  <text x="574" y="282" class="label">电源</text>
</svg>
