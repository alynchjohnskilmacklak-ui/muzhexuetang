<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>课时领先榜 · 上课时长对比（家长端示例预览）</title>
<style>
  :root{
    --primary-deep:#C2541F; --primary-deep-2:#E8784A;
    --gain-g:#1E7A33; --gain-g2:#2FA04F;
    --gain-o:#C2541F; --gain-o2:#E8784A;
    --radius-lg:20px; --radius-sm:12px; --shadow-lg:0 18px 48px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#0f0a06,#1a1108);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#f5ede2;min-height:100vh;padding:28px 0}
  .wrap{max-width:1320px;margin:0 auto}
  .page-title{text-align:center;font-size:13px;letter-spacing:.25em;color:#E8A05A;margin-bottom:26px}

  /* ===== 课时领先榜：上课时长对比（家长端示例） ===== */
  .hours-compare{max-width:1320px;margin:30px auto 0;padding:0 20px}
  .hc-card{background:linear-gradient(160deg,#1a1108,#2e2113);border:1px solid rgba(232,160,90,.18);border-radius:var(--radius-lg);padding:34px 26px 22px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
  .hc-card::before{content:"";position:absolute;top:-90px;left:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(232,160,90,.14),transparent 70%)}
  .hc-tag{font-size:11px;letter-spacing:.3em;color:#E8A05A;text-align:center;margin-bottom:10px}
  .hc-title{font-size:clamp(22px,3.6vw,30px);font-weight:800;color:#f5ede2;text-align:center;margin:0}
  .hc-sub{font-size:13px;color:#b9a996;text-align:center;margin-top:6px}
  .hc-badge{margin:20px auto 0;max-width:720px;text-align:center;border-radius:16px;padding:15px 18px}
  .hc-badge .b-tier{font-size:19px;font-weight:900;letter-spacing:.05em}
  .hc-badge .b-msg{font-size:13px;margin-top:6px;line-height:1.55}
  .hc-badge.praise{background:linear-gradient(135deg,rgba(30,122,51,.3),rgba(30,122,51,.1));border:1px solid rgba(94,180,120,.55);color:#7fdc9c}
  .hc-badge.praise .b-tier{color:#a8f0bd}
  .hc-badge.encourage{background:linear-gradient(135deg,rgba(200,84,31,.32),rgba(200,84,31,.1));border:1px solid rgba(232,160,90,.55);color:#f0b98c}
  .hc-badge.encourage .b-tier{color:#ffcf9e}
  .hc-badge.remind{background:linear-gradient(135deg,rgba(190,45,40,.28),rgba(190,45,40,.1));border:1px solid rgba(230,110,100,.5);color:#f0a9a0}
  .hc-badge.remind .b-tier{color:#ffb4ab}
  .hc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .hc-stat{background:rgba(255,255,255,.05);border:1px solid rgba(232,160,90,.15);border-radius:14px;padding:13px 10px;text-align:center}
  .hc-stat .s-label{font-size:12px;color:#b9a996}
  .hc-stat .s-num{font-size:28px;font-weight:900;color:#f5ede2;margin-top:4px;font-variant-numeric:tabular-nums}
  .hc-stat .s-num em{font-style:normal;font-size:.45em;font-weight:600;opacity:.75;margin-left:2px}
  .hc-stat.hl{background:linear-gradient(135deg,var(--primary-deep),var(--primary-deep-2));border:none}
  .hc-stat.hl .s-num{color:#fff}
  .hc-chart{height:380px;margin-top:14px}
  .hc-demo{display:flex;justify-content:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .hc-demo button{border:1px solid rgba(200,150,90,.45);background:rgba(255,255,255,.06);color:#d9c7ac;font-size:12px;line-height:1;padding:9px 16px;border-radius:999px;cursor:pointer;font-family:inherit;min-height:36px}
  .hc-demo button:hover{background:rgba(232,160,90,.16)}
  .hc-demo button.active{background:linear-gradient(135deg,var(--primary-deep),var(--primary-deep-2));border-color:transparent;color:#fff;font-weight:700}
  .hc-note{text-align:center;font-size:12px;color:#6b5e4e;padding:10px 16px 0;line-height:1.6}
  @media (max-width:720px){.hours-compare{padding:0 14px}.hc-card{padding:26px 14px 18px}.hc-stats{grid-template-columns:1fr 1fr}.hc-stat:nth-child(3){grid-column:span 2}.hc-chart{height:420px}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="page-title">家长端 · 上课时长对比 · 示例预览</div>
  </div>

  <!-- ================= 课时领先榜：上课时长对比（家长端示例） ================= -->
  <section class="hours-compare" id="hours-compare" aria-label="上课时长对比">
    <div class="hc-card">
      <div class="hc-tag">MOREJOY 学习时长 · 家长视角</div>
      <h2 class="hc-title">上课时长，谁在领先？</h2>
      <p class="hc-sub">本月累计上课时长与同班同学对比 · 超过80%表扬 · 超过50%鼓励 · 低于50%提醒</p>
      <div class="hc-badge praise" id="hcBadge">
        <div class="b-tier" id="hcTier">表扬 · 领先班级 80%+</div>
        <div class="b-msg" id="hcMsg">孩子本月上课投入超过班级 80% 的同学，保持这份坚持，稳扎稳打，成绩自会说话！</div>
      </div>
      <div class="hc-stats">
        <div class="hc-stat"><div class="s-label">我的课时</div><div class="s-num"><span id="hcMine">0</span><em>小时</em></div></div>
        <div class="hc-stat"><div class="s-label">班级平均</div><div class="s-num"><span id="hcAvg">0</span><em>小时</em></div></div>
        <div class="hc-stat hl"><div class="s-label">领先同学比例</div><div class="s-num"><span id="hcPct">0</span><em>%</em></div></div>
      </div>
      <div class="hc-chart" id="hcChart" role="img" aria-label="上课时长对比柱状图"></div>
      <div class="hc-demo" id="hcDemo">
        <button type="button" data-case="a" class="active" aria-pressed="true">示例 · 表扬</button>
        <button type="button" data-case="b" aria-pressed="false">示例 · 鼓励</button>
        <button type="button" data-case="c" aria-pressed="false">示例 · 提醒</button>
      </div>
      <p class="hc-note">* 示例数据仅用于展示对比形式与反馈规则；正式上线后接入真实课时统计，同学姓名自动脱敏。</p>
    </div>
  </section>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script>
/* ================= 课时领先榜：上课时长对比（家长端示例） ================= */
(function(){
  var CASES = {
    a: { mine: 42.5, cls: [45.2, 40.8, 39.5, 37.2, 35.6, 33.1, 30.4, 27.8, 24.5, 20.6, 16.3, 12.4] },
    b: { mine: 36.8, cls: [45.2, 42.5, 40.8, 39.5, 37.2, 35.6, 33.1, 30.4, 27.8, 24.5, 20.6, 16.3] },
    c: { mine: 24.8, cls: [45.2, 42.5, 40.8, 39.5, 37.2, 35.6, 34.6, 33.1, 30.4, 27.8, 24.5, 20.6] }
  };
  var NAMES = ["李*晨","王*然","张*萱","刘*宇","陈*欣","杨*泽","赵*桐","黄*睿","周*涵","吴*凡","徐*琳","孙*琪"];
  var TIERS = {
    praise:    { cls: "praise",    tier: "表扬 · 领先班级 80%+", msg: "孩子本月上课投入超过班级 80% 的同学，保持这份坚持，稳扎稳打，成绩自会说话！" },
    encourage: { cls: "encourage", tier: "鼓励 · 已超过班级一半", msg: "孩子本月上课时长超过班级一半的同学，再加把劲，向第一梯队冲刺！" },
    remind:    { cls: "remind",    tier: "提醒 · 低于班级一半",   msg: "孩子本月课时低于班级一半同学，建议适当增加排课，跟上班级节奏。" }
  };
  var badge = document.getElementById("hcBadge");
  var tierEl = document.getElementById("hcTier");
  var msgEl = document.getElementById("hcMsg");
  var mineEl = document.getElementById("hcMine");
  var avgEl = document.getElementById("hcAvg");
  var pctEl = document.getElementById("hcPct");
  var chartEl = document.getElementById("hcChart");
  var demoEl = document.getElementById("hcDemo");
  var chart = echarts.init(chartEl);
  function tierFor(p){ return p > 80 ? TIERS.praise : (p > 50 ? TIERS.encourage : TIERS.remind); }
  function render(key){
    var d = CASES[key];
    var rows = d.cls.map(function(h, i){ return { name: NAMES[i], hours: h }; });
    rows.push({ name: "我的孩子", hours: d.mine, me: true });
    rows.sort(function(x, y){ return y.hours - x.hours; });
    var below = 0, i;
    for (i = 0; i < d.cls.length; i++){ if (d.cls[i] < d.mine) below++; }
    var pct = Math.round(below / d.cls.length * 100);
    var sum = d.mine, k;
    for (k = 0; k < d.cls.length; k++){ sum += d.cls[k]; }
    var avg = sum / (d.cls.length + 1);
    var t = tierFor(pct);
    badge.className = "hc-badge " + t.cls;
    tierEl.textContent = t.tier;
    msgEl.textContent = t.msg;
    mineEl.textContent = d.mine.toFixed(1);
    avgEl.textContent = avg.toFixed(1);
    pctEl.textContent = pct;
    chart.setOption({
      backgroundColor: "transparent",
      tooltip: { trigger: "axis", triggerOn: "click", renderMode: "richText", confine: true, textStyle: { fontSize: 11, lineHeight: 15 }, padding: [6, 8] },
      grid: { left: 8, right: 46, top: 14, bottom: 8, containLabel: true },
      xAxis: { type: "value", name: "小时", nameTextStyle: { color: "#b9a996" }, axisLabel: { color: "#9a8e7a", fontSize: 11 }, splitLine: { lineStyle: { color: "rgba(245,237,226,.07)" } } },
      yAxis: { type: "category", data: rows.map(function(r){ return r.name; }), axisLabel: { color: "#d9c7ac", fontSize: 12 }, axisLine: { show: false }, axisTick: { show: false } },
      series: [{
        name: "本月课时（小时）", type: "bar", barWidth: 15,
        data: rows.map(function(r, idx){
          return { value: r.hours, itemStyle: { color: r.me ? "#E8784A" : (idx % 2 ? "rgba(232,160,90,.34)" : "rgba(232,160,90,.2)"), borderRadius: r.me ? 4 : 2 } };
        }),
        label: { show: true, position: "right", color: "#f5ede2", fontSize: 11, formatter: "{c}" },
        markLine: {
          silent: true, symbol: "none",
          data: [{ xAxis: avg }],
          lineStyle: { color: "#f5ede2", type: "dashed", width: 1 },
          label: { formatter: "班级平均 " + avg.toFixed(1) + "h", color: "#f5ede2", fontSize: 11, position: "insideEndTop" }
        }
      }]
    });
  }
  demoEl.addEventListener("click", function(e){
    var btn = e.target.closest ? e.target.closest("button[data-case]") : null;
    if (!btn) return;
    var btns = demoEl.querySelectorAll("button");
    for (var i = 0; i < btns.length; i++){ btns[i].classList.remove("active"); btns[i].setAttribute("aria-pressed", "false"); }
    btn.classList.add("active"); btn.setAttribute("aria-pressed", "true");
    render(btn.getAttribute("data-case"));
  });
  window.addEventListener("resize", function(){ chart.resize(); });
  render("a");
})();
</script>
</body>
</html>
